<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit</title>
<link rel="stylesheet" href="landing.css">
<link rel="stylesheet" href="shared.css">
<script src="tools.js"></script>
</head>
<body>
  <div class="page-loader" id="page-loader">
    <div class="loader-grid"><span></span><span></span><span></span><span></span></div>
    <div class="loader-label">Betöltés…</div>
  </div>
  <script>
    (function () {
      var MIN_MS = 550;
      var start = performance.now();
      function reveal() {
        var el = document.getElementById("page-loader");
        if (!el) return;
        var wait = Math.max(0, MIN_MS - (performance.now() - start));
        setTimeout(function () { el.classList.add("is-hidden"); }, wait);
      }
      if (document.readyState === "complete") reveal();
      else window.addEventListener("load", reveal);
    })();
  </script>

  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>
  <div class="blob blob-c" aria-hidden="true"></div>

  <main class="landing">
    <section class="hero">
      <h1 class="hero-title">Digit</h1>
      <p class="hero-sub">Interaktív, böngészőben futó eszközök digitális technika tanulásához — nincs szükség telepítésre vagy regisztrációra, minden nézet élőben, egymással szinkronban frissül, az eredmény pedig PDF-ként is exportálható.</p>
    </section>

    <section class="tools-section">
      <h2 class="section-heading">Eszközök</h2>
      <div class="tools-grid" id="tools-grid"></div>
    </section>

    <p class="footer-note">Készült digitális technika tanuláshoz.</p>
  </main>

  <script src="landing.js"></script>
  <script src="transition.js"></script>
</body>
</html>
